<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Watchdog SaaS Portal</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="css/style.css?v=21">
    <link rel="stylesheet" href="css/layout.css?v=21">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // If already logged in, redirect directly
        try {
            const u = JSON.parse(localStorage.getItem('watchdog_auth_user') || 'null');
            if (u && u.authorized) {
                window.location.replace(u.isMaster ? 'select-server.html' : 'index.html');
            }
        } catch(e) {}
    </script>
    <style>
        body {
            background: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.9) 0px, transparent 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f1f5f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(7, 14, 27, 0.98));
            border: 1px solid rgba(129, 140, 248, 0.25);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.18);
            width: 100%;
            max-width: 450px;
            padding: 36px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: cardFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #38bdf8, #818cf8);
        }

        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px auto;
            display: block;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.45));
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 6px 0;
            letter-spacing: -0.4px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        .btn-oauth-discord {
            width: 100%;
            background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 13px 18px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(88, 101, 242, 0.4);
            margin-bottom: 22px;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-oauth-discord:hover {
            background: linear-gradient(135deg, #4752C4 0%, #3c45a5 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(88, 101, 242, 0.55);
            color: #ffffff;
        }

        .login-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .login-divider::before, .login-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .login-divider span {
            padding: 0 12px;
        }

        .login-footer {
            margin-top: 24px;
            font-size: 11.5px;
            color: #64748b;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="login-card">
        <img src="logo.png" alt="Watchdog" class="login-logo" />
        <h1 class="login-title">Watchdog SaaS Portal</h1>
        <p class="login-subtitle">Multi-tenant FiveM sanction & moderation forensics. Authenticate to access your server dashboard.</p>

        <div id="login-error-msg" class="auth-error-msg"></div>

        <!-- 1-Click Discord OAuth2 Button -->
        <a href="/api/auth/discord/login" id="btn-discord-oauth" class="btn-oauth-discord">
            <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            <span>Login with Discord</span>
        </a>

        <div class="login-divider">
            <span>Or Direct Discord ID</span>
        </div>

        <form id="login-form" onsubmit="handleDirectLogin(event)">
            <div class="auth-input-group">
                <label>Discord User ID</label>
                <input type="text" id="login-discord-id" class="auth-input" placeholder="e.g. 320110089727901697" required autofocus autocomplete="off" />
            </div>
            <button type="submit" id="btn-login-submit" class="btn-auth-submit">
                <i data-lucide="shield-check" style="width: 17px; height: 17px;"></i>
                <span>Verify & Enter</span>
            </button>
        </form>

        <div class="login-footer">
            <i data-lucide="lock" style="width: 13px; height: 13px; color: #818cf8;"></i>
            <span>Encrypted access restricted to registered Server Owners & Staffers.</span>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="js/api.js?v=21"></script>
    <script src="js/ui.js?v=21"></script>
    <script src="js/login.js?v=21"></script>
</body>
</html>
